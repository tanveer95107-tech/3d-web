<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My 3D Website | GitHub</title>
    
    <!-- Tailwind CSS (Styling ke liye) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- GSAP (Text Animation ke liye) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <!-- Three.js (3D ke liye) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        body {
            margin: 0;
            overflow-x: hidden;
            background-color: #0a0a0a;
            color: white;
            font-family: 'Inter', sans-serif;
        }
        /* Canvas ko background mein rakhne ke liye */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 0;
        }
        /* Content ko canvas ke upar rakhne ke liye */
        .content-overlay {
            position: relative;
            z-index: 10;
            pointer-events: none; /* Mouse 3D tak jaye */
        }
        .content-overlay button, .content-overlay a {
            pointer-events: auto; /* Buttons clickable rahein */
        }
    </style>
</head>
<body>

    <!-- 1. 3D Canvas (Background) -->
    <div id="canvas-container"></div>

    <!-- 2. Hero Section (Text) -->
    <section class="h-screen flex flex-col justify-center items-start px-8 md:px-20 content-overlay">
        <h1 class="hero-title text-6xl md:text-8xl font-bold tracking-tighter mb-4 opacity-0">
            APKA <span class="text-orange-500">NAAM</span>
        </h1>
        <p class="hero-sub text-xl md:text-2xl text-gray-400 max-w-xl font-light mb-8 opacity-0">
            Main 3D websites banata hoon jo client ko impress kar deti hain.
        </p>
        <button class="hero-btn px-8 py-4 bg-orange-500 text-white font-bold rounded-sm hover:bg-orange-600 transition-all opacity-0">
            Contact Karein
        </button>
    </section>

    <!-- 3. Scroll Section (Taake scroll ka effect dikhe) -->
    <section class="h-screen flex items-center justify-center content-overlay bg-black/50 backdrop-blur-sm">
        <h2 class="text-4xl md:text-6xl font-bold text-center">
            Scroll Karo <br> <span class="text-orange-500">3D Move Karega</span>
        </h2>
    </section>

    <!-- JavaScript Logic -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 1. Three.js Setup ---
        const container = document.getElementById('canvas-container');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        // Fog se depth aati hai
        scene.fog = new THREE.FogExp2(0x0a0a0a, 0.05);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- 2. Lights ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xff6600, 2, 20); // Orange Light
        pointLight.position.set(2, 3, 4);
        scene.add(pointLight);

        const pointLight2 = new THREE.PointLight(0x0066ff, 1, 20); // Blue Light
        pointLight2.position.set(-3, -2, 2);
        scene.add(pointLight2);

        // --- 3. 3D Objects ---
        // Main Cube (Orange)
        const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const material = new THREE.MeshStandardMaterial({ 
            color: 0xff6600, 
            roughness: 0.2, 
            metalness: 0.8 
        });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // Chota Cube (Background mein)
        const smallGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
        const smallMat = new THREE.MeshStandardMaterial({ color: 0xffffff, wireframe: true });
        const smallCube = new THREE.Mesh(smallGeo, smallMat);
        smallCube.position.set(2, 1, -2);
        scene.add(smallCube);

        // --- 4. Mouse Move Effect ---
        let mouseX = 0;
        let mouseY = 0;
        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        // --- 5. Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Cube ghoomta rahe
            cube.rotation.x += 0.005;
            cube.rotation.y += 0.01;

            // Small cube ulta ghoome
            smallCube.rotation.x -= 0.01;
            smallCube.rotation.y -= 0.005;

            // Mouse ke hisaab se camera thora move ho (Parallax)
            camera.position.x += (mouseX * 0.5 - camera.position.x) * 0.05;
            camera.position.y += (mouseY * 0.5 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }
        animate();

        // --- 6. GSAP Animations (Text Entry) ---
        const tl = gsap.timeline({ defaults: { ease: "power3.out" } });

        tl.to(".hero-title", { opacity: 1, y: -20, duration: 1, delay: 0.5 })
          .to(".hero-sub", { opacity: 1, y: -10, duration: 1 }, "-=0.7")
          .to(".hero-btn", { opacity: 1, y: 0, duration: 1 }, "-=0.7");

        // --- 7. GSAP ScrollTrigger (Scroll par 3D Move) ---
        gsap.registerPlugin(ScrollTrigger);

        gsap.to(cube.position, {
            z: -5,
            y: 2,
            scrollTrigger: {
                trigger: "body",
                start: "top top",
                end: "bottom bottom",
                scrub: 1
            }
        });

        gsap.to(camera.position, {
            z: 2,
            scrollTrigger: {
                trigger: "body",
                start: "top top",
                end: "bottom bottom",
                scrub: 2
            }
        });

        // --- 8. Window Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
